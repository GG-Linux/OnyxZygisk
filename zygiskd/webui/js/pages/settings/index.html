<div class="card">
  <div class="card-title">{{settings.appearance}}</div>
  <div class="setting-row">
    <span class="s-label">{{settings.theme}}</span>
    <select data-role="theme">
      <option value="system">{{settings.themeSystem}}</option>
      <option value="light">{{settings.themeLight}}</option>
      <option value="dark">{{settings.themeDark}}</option>
      <option value="amoled">{{settings.themeAmoled}}</option>
    </select>
  </div>
  <div class="setting-row">
    <span class="s-label">{{settings.language}}</span>
    <select data-role="lang"></select>
  </div>
</div>
<div class="card">
  <div class="card-title">{{settings.about}}</div>
  <p class="hint">{{settings.aboutText}}</p>
</div>
