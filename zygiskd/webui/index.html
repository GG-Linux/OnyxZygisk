<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OnyxZygisk</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<header class="app-header">
  <div class="header-icon"><img src="tux.png" alt="Tux" width="40" height="40"></div>
  <div class="header-text">
    <h1>OnyxZygisk</h1>
    <div class="sub" id="header-sub">Zygisk Implementation</div>
  </div>
  <span class="header-badge" id="host-badge">--</span>
</header>

<!-- Pages are injected here by the router -->
<main id="page_content"></main>

<!-- Bottom navigation -->
<nav id="navbar" class="navbar">
  <button class="nav-item active" data-page="status">
    <span class="nav-ico">📊</span><span class="nav-label" data-nav="status">Status</span>
  </button>
  <button class="nav-item" data-page="modules">
    <span class="nav-ico">📦</span><span class="nav-label" data-nav="modules">Modules</span>
  </button>
  <button class="nav-item" data-page="fn">
    <span class="nav-ico">🧬</span><span class="nav-label" data-nav="fn">FN</span>
  </button>
  <button class="nav-item" data-page="logs">
    <span class="nav-ico">📜</span><span class="nav-label" data-nav="logs">Logs</span>
  </button>
  <button class="nav-item" data-page="apatch">
    <span class="nav-ico">📡</span><span class="nav-label" data-nav="apatch">APatch</span>
  </button>
  <button class="nav-item" data-page="settings">
    <span class="nav-ico">⚙️</span><span class="nav-label" data-nav="settings">Settings</span>
  </button>
</nav>

<!-- APatch compat: some APatch builds inject the interface as window.apatch
     rather than window.ksu. Alias it so the KernelSU-style bridge works. -->
<script>
  if (typeof window.apatch !== "undefined" && typeof window.ksu === "undefined") {
    window.ksu = window.apatch;
  }
</script>
<script src="js/app.js" type="module"></script>
</body>
</html>
