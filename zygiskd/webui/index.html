<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OnyxZygisk</title>
</head>
<body>

<!-- Vue mounts the header + stacked sections here -->
<main id="app"></main>

<!-- APatch compat: some APatch builds inject the interface as window.apatch
     rather than window.ksu. Alias it so the KernelSU-style bridge works. -->
<script>
  if (typeof window.apatch !== "undefined" && typeof window.ksu === "undefined") {
    window.ksu = window.apatch;
  }
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
